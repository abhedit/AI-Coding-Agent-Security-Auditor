{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="wrap section narrow-form">
  <h1>Create your workspace</h1>
  {% if plan in ('pro','team') %}<p class="muted">You picked <strong>{{ plans[plan].name }}</strong>. Start on Starter and upgrade from Billing after sign-up.</p>{% endif %}
  <form method="post" action="/signup" class="panel">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Your name<input name="name" required autocomplete="name"></label>
    <label>Company / team (optional)<input name="company" autocomplete="organization"></label>
    <label>Work email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password (10+ characters)<input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
    <button class="btn">Create account</button>
    <p class="small muted">Already have an account? <a href="/login">Log in</a></p>
  </form>
</section>
{% endblock %}
