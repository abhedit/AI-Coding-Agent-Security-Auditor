# Production-style stack: app + Postgres. `cp .env.example .env`, edit, then `docker compose up -d`.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agentsentinel:${POSTGRES_PASSWORD:-change-me}@db:5432/agentsentinel
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentsentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: agentsentinel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsentinel"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
